spring:
  application:
    name: mcs-wallet-provider
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:8}
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 1500000
      data-source-properties:
        tcpKeepAlive: true
        connectTimeout: 5
        socketTimeout: 20
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    create-schemas: false
    default-schema: wallet_provider
    schemas: wallet_provider
    table: flyway_schema_history
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: wallet_provider
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    pe.gob.mtc.walletprovider: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  file:
    name: ${LOG_FILE:}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
wallet-provider:
  verifier-m2m:
    enabled: ${MTC_VERIFIER_M2M_ENABLED:false}
    client-ids: ${MTC_VERIFIER_M2M_CLIENT_IDS:}
  portal:
    origins: ${MTC_PORTAL_ALLOWED_ORIGINS:}
    # Inactivo hasta provisionar Cognito institucional; solo personal MTC.
    enabled: ${MTC_PORTAL_ENABLED:false}
    client-ids: ${MTC_PORTAL_COGNITO_CLIENT_IDS:}
  signing:
    key-store: ${SIGNING_KEYSTORE_PATH}
    password: ${SIGNING_KEYSTORE_PASSWORD}
    alias: ${SIGNING_KEY_ALIAS}
    key-id: ${SIGNING_KEY_ID}
    issuer: ${ATTESTATION_ISSUER}
    wallet-client-id: ${WALLET_CLIENT_ID}
  android:
    package-name: ${ANDROID_PACKAGE}
    certificate-sha256: ${ANDROID_CERT_SHA256}
    cloud-project-number: ${PLAY_CLOUD_PROJECT_NUMBER}
    key-attestation-roots: ${ANDROID_ATTESTATION_ROOTS_PATH}
  ios:
    app-id: ${IOS_APP_ID}
    app-attest-root: ${APPLE_APP_ATTEST_ROOT_PATH}
    production: ${IOS_APP_ATTEST_PRODUCTION:true}
  diagnostics-sync:
    # Enable only when the institutional client_credentials identity and mTLS are provisioned.
    enabled: ${WALLET_DIAG_SYNC_ENABLED:false}
    base-url: ${WALLET_DIAG_SYNC_BASE_URL:}
    token-url: ${WALLET_DIAG_SYNC_TOKEN_URL:}
    client-id: ${WALLET_DIAG_SYNC_CLIENT_ID:}
    client-secret: ${WALLET_DIAG_SYNC_CLIENT_SECRET:}
    scope: ${WALLET_DIAG_SYNC_SCOPE:diagnostics.device.sync}
    allow-http-in-mesh: ${WALLET_DIAG_SYNC_ALLOW_HTTP_IN_MESH:false}
  identity:
    # OFF hasta integrar un adaptador M2M confiable para evidencia de RENIEC/MiMoto.
    enabled: ${WALLET_IDENTITY_ENABLED:false}
    hmac-key-b64: ${WALLET_IDENTITY_HMAC_KEY_B64:}
    encryption-key-b64: ${WALLET_IDENTITY_ENCRYPTION_KEY_B64:}
    key-version: ${WALLET_IDENTITY_KEY_VERSION:1}
    # Verificador M2M firmado por MiMoto; SIN endpoints ni emisor habilitados aun.
    mimoto-evidence-issuer: ${WALLET_IDENTITY_MIMOTO_EVIDENCE_ISSUER:}
    mimoto-evidence-audience: ${WALLET_IDENTITY_MIMOTO_EVIDENCE_AUDIENCE:}
    mimoto-evidence-signer-cert-path: ${WALLET_IDENTITY_MIMOTO_SIGNER_CERT_PATH:}
    mimoto-m2m:
      # OFF hasta contar con OAuth2 client_credentials Cognito QA y mTLS / mesh.
      enabled: ${WALLET_IDENTITY_MIMOTO_M2M_ENABLED:false}
      client-ids: ${WALLET_IDENTITY_MIMOTO_M2M_CLIENT_IDS:}
    credential-binding:
      # V5: vínculo de la clave de credencial con la instalación; OFF por defecto.
      enabled: ${WALLET_IDENTITY_CREDENTIAL_BINDING_ENABLED:false}
    certify-m2m:
      # API de autorización exclusivamente para Certify, nunca para Wallet.
      enabled: ${WALLET_IDENTITY_CERTIFY_M2M_ENABLED:false}
      client-ids: ${WALLET_IDENTITY_CERTIFY_M2M_CLIENT_IDS:}
  policy:
    challenge-seconds: ${CHALLENGE_SECONDS:180}
    attestation-seconds: ${ATTESTATION_SECONDS:300}
    maximum-evidence-age-seconds: ${MAXIMUM_EVIDENCE_AGE_SECONDS:120}
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# Cognito remains disabled until provisioned and validated in QA.
wallet:
  cognito:
    enabled: ${WALLET_COGNITO_ENABLED:false}
    issuer-uri: ${WALLET_COGNITO_ISSUER_URI:}
    trust-client-ids: ${WALLET_COGNITO_TRUST_CLIENT_IDS:}
    admin-client-ids: ${WALLET_COGNITO_ADMIN_CLIENT_IDS:}
